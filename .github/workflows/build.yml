name: Build

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes mingw-w64 zip

      - name: Build
        run: make

      - name: Verify executable
        run: |
          file syscolor-demo.exe | grep -q 'PE32+ executable'
          x86_64-w64-mingw32-objdump -p syscolor-demo.exe | grep -Eq 'Subsystem[[:space:]]+00000002'
          if x86_64-w64-mingw32-objdump -h syscolor-demo.exe | grep -q '\.debug_'; then
            echo 'Release executable contains debug sections' >&2
            exit 1
          fi

      - name: Package build
        run: |
          mkdir -p dist/package
          cp syscolor-demo.exe wine-breeze-dark.reg wine-reset-theme.reg README.md LICENSE dist/package/
          (cd dist/package && zip ../wine-breeze-dark-windows-x86_64.zip syscolor-demo.exe wine-breeze-dark.reg wine-reset-theme.reg README.md LICENSE)

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: wine-breeze-dark-windows-x86_64
          path: dist/wine-breeze-dark-windows-x86_64.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download build
        uses: actions/download-artifact@v8
        with:
          name: wine-breeze-dark-windows-x86_64
          path: dist

      - name: Name versioned archive
        run: mv dist/wine-breeze-dark-windows-x86_64.zip "dist/wine-breeze-dark-${GITHUB_REF_NAME}-windows-x86_64.zip"

      - name: Create GitHub Release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME"; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "Wine Breeze Dark $GITHUB_REF_NAME"
          fi
          gh release upload "$GITHUB_REF_NAME" \
            "dist/wine-breeze-dark-${GITHUB_REF_NAME}-windows-x86_64.zip" \
            --clobber
